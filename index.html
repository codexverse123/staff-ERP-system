<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff ERP System — College & Hostel Management</title>
  
  <!-- SEO & Meta -->
  <meta name="description" content="Production-ready Staff ERP system with Role-Based Access Control, Warden Gate Pass Approvals, Interactive QR Scanning & Department Complaints Management.">
  
  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Exact Design System CSS -->

  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="js/components/LoginPortal.js"></script>
  <script src="js/components/AuthModal.js"></script>
